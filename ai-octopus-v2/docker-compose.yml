services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: octo
      POSTGRES_PASSWORD: octo_dev_password
      POSTGRES_DB: octo
    ports:
      - "5432:5432"
    volumes:
      - octo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octo -d octo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  octo_pgdata:
