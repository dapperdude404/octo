name: Build and verify AI Octopus Android APK

on:
  push:
    branches: [main]
    paths:
      - 'ai-octopus-v2/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'ai-octopus-v2/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Test, build, and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ai-octopus-v2

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Confirm candidate versions and release guard
        run: npm run version:check

      - name: Run source tests
        run: npm test

      - name: Build web assets
        run: npm run web:check && npm run web:build

      - name: Generate Capacitor Android project
        run: npx cap add android && node scripts/android-icon.js && node scripts/stamp-android-version.js

      - name: Compile Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists, is readable, and is signed
        run: |
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -n 2
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          expected_name="$(node -p 'require("./package.json").version')"
          expected_code="$(node --input-type=module -e 'import {androidVersionCode} from "./scripts/versioning.js"; console.log(androidVersionCode(process.argv[1]))' "$expected_name")"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > /tmp/octo-apk-badging.txt
          grep -F "versionCode='$expected_code'" /tmp/octo-apk-badging.txt
          grep -F "versionName='$expected_name'" /tmp/octo-apk-badging.txt
          # Never distribute a CI-debug APK with the production package ID:
          # ephemeral GitHub runner keys cannot upgrade an app signed elsewhere.
          expected_package="com.octoai.app.dev$GITHUB_RUN_ID"
          grep -F "package: name='$expected_package' " /tmp/octo-apk-badging.txt
          if grep -Fq "package: name='com.octoai.app' " /tmp/octo-apk-badging.txt; then
            echo "Refusing a debug APK that conflicts with the production package"; exit 1
          fi
          echo "Debug APK installs alongside the production app: $expected_package"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | grep -E "Signer #1 certificate SHA-256 digest"
          ls -lh "$apk"
          sha256sum "$apk"

      - name: Upload downloadable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-octopus-android-debug-apk-isolated-${{ github.run_id }}
          path: ai-octopus-v2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
