name: Export AI Octopus release ZIPs for Drive backup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-backup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source and published website
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/AI-Octopus-v2.4.0-source.zip HEAD
          (cd app && zip -q -r ../dist/AI-Octopus-v2.4.0-web.zip .)
          unzip -t dist/AI-Octopus-v2.4.0-web.zip | tail -n 2
      - name: Upload source and web backup ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ai-octopus-v2.4.0-release-drive-backup
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error
