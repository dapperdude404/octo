name: Publish AI Octopus release and backend package

# Deliberately never triggered by push or PR: publication is a separate,
# manually authorized action after review, version bump and signed-off release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved stable SemVer without v (e.g. 5.1.0)'
        required: true
        type: string
      confirm_publish:
        description: 'Type CONFIRM-PUBLISH-vX.Y.Z exactly to permit publication'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Select release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Only stable numeric SemVer supported"; exit 1; fi
          if [[ "$CONFIRM_PUBLISH" != "CONFIRM-PUBLISH-v$REQUESTED_VERSION" ]]; then
            echo "Publish confirmation mismatch; no tag, package, or release created"; exit 1
          fi
          PKG_VERSION="$(node -p 'require("./ai-octopus-v2/package.json").version')"
          DESKTOP_VERSION="$(node -p 'require("./desktop/package.json").version')"
          if [[ "$REQUESTED_VERSION" != "$PKG_VERSION" || "$REQUESTED_VERSION" != "$DESKTOP_VERSION" ]]; then
            echo "Requested version does not match verified source metadata"; exit 1
          fi
          if [[ ! -s "RELEASE_NOTES_v$REQUESTED_VERSION.md" ]]; then
            echo "Approved release notes missing for requested version"; exit 1
          fi
          echo "tag=v$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and run tests
        working-directory: ai-octopus-v2
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run web:build
      - name: Package source and web downloads
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/AI-Octopus-source-${{ steps.version.outputs.tag }}.zip" HEAD
          (cd app && zip -q -r "../dist/AI-Octopus-web-${{ steps.version.outputs.tag }}.zip" .)
          unzip -t dist/AI-Octopus-web-*.zip | tail -n 2
          sha256sum dist/*.zip
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish optional API container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ai-octopus-v2/Dockerfile
          push: true
          tags: ghcr.io/dapperdude404/octo-api:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/dapperdude404/octo
            org.opencontainers.image.description=AI Octopus Node.js API requires a separate host PostgreSQL and private secrets
      - name: Create a GitHub release and attach ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping rather than overwriting existing assets"
          else
            gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "AI Octopus $TAG" --notes-file "RELEASE_NOTES_v${{ inputs.version }}.md"
          fi
